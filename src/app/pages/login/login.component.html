<div class="login-wrapper">
  <div class="card login-card">
    <form [formGroup]="formularioLogin" (ngSubmit)="login()">
      <h2>Ingreso Administrativo</h2>

      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-dark text-danger">
            <ion-icon [icon]="mailIcon"></ion-icon>
          </span>
          <input type="text" id="username" class="form-control"
                 formControlName="username" placeholder="Usuario">
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-dark text-danger">
            <ion-icon [icon]="lockClosedIcon"></ion-icon>
          </span>
          <input type="password" id="password" class="form-control"
                 formControlName="password" placeholder="Contraseña">
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 small text-light">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label for="rememberMe" class="form-check-label">Recuérdame</label>
        </div>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-danger w-100 fw-bold" [disabled]="formularioLogin.invalid">
        Ingresar
      </button>

      <div class="text-center mt-3 small text-light">
        ¿No tienes una cuenta? <a href="#">Regístrate</a>
      </div>
    </form>
  </div>
</div>
